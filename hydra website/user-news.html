<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYDRA ARENA | 2nd Anniversary Announcements</title>
    <meta name="description" content="Latest HYDRA 2nd Anniversary tournament announcements, updates and official news.">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="user-news.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">`n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>`n    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header -->
    <header class="nav-header">
        <div class="nav-left">
            <a href="user.html" class="contact-btn">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
            <div class="nav-brand" style="cursor:default;">
                <div class="nav-logo-wrapper">
                    <img src="new-logo.jpg" alt="HYDRA FC Logo" class="nav-logo-img">
                </div>
                <span class="nav-title">HYDRA ESPORTS</span>
                <span class="anniversary-badge"><i class="fa-solid fa-cake-candles"></i> 2nd Anniversary</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="nav-icon-btn" aria-label="Profile">
                <i class="fa-solid fa-circle-user"></i>
            </button>
        </div>
    </header>

    <!-- Page Hero -->
    <section class="page-hero">
        <h1><i class="fa-solid fa-cake-candles"></i> 2nd Anniversary Announcements</h1>
        <p>Latest announcements, 2nd Anniversary tournaments and official updates.</p>
    </section>

    <!-- Updates Container — ID fixed to match user-news.js which looks for "newsContainer" -->
    <div id="newsContainer" class="page-wrapper">
        <div class="card" style="text-align: center; padding: 48px; grid-column: 1/-1;">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-muted); font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 1px; margin-top: 8px;">Loading 2nd Anniversary Updates...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>HAIL HYDRA</p>
    </footer>

    <script src="3d-effects.js"></script>
    <script src="supabas.js"></script>
    <script type="module" src="user-news.js"></script>

</body>
</html>
