<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYDRA | 2nd Anniversary Tournament Winners</title>
    <meta name="description" content="Official HYDRA 2nd Anniversary Championship tournament winners and leaderboard.">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">`n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>`n    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="nav-header">
        <div class="nav-left">
            <a href="user.html" class="contact-btn">
                <i class="fa-solid fa-arrow-left"></i> Dashboard
            </a>
            <div class="nav-brand" style="cursor:default;">
                <div class="nav-logo-wrapper">
                    <img src="new-logo.jpg" alt="HYDRA FC Logo" class="nav-logo-img">
                </div>
                <span class="nav-title">HYDRA ESPORTS</span>
                <span class="anniversary-badge"><i class="fa-solid fa-cake-candles"></i> 2nd Anniversary</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="nav-icon-btn" aria-label="Profile">
                <i class="fa-solid fa-circle-user"></i>
            </button>
        </div>
    </header>

    <!-- Page Hero -->
    <section class="page-hero">
        <h1>🏆 Tournament Winners</h1>
        <p>Official HYDRA 2nd Anniversary Championship Results</p>
    </section>

    <!-- Winners Table -->
    <div class="page-wrapper">
        <p class="section-title" style="margin-bottom: 20px;"><i class="fa-solid fa-trophy"></i> Leaderboard</p>
        <div class="table-wrapper card">
            <table class="winner-table" style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr>
                        <th style="padding: 14px;">Position</th>
                        <th style="padding: 14px;">Player Name</th>
                        <th style="padding: 14px;">Team</th>
                        <th style="padding: 14px;">Tournament</th>
                    </tr>
                </thead>
                <tbody id="winnerTableBody">
                    <tr>
                        <td colspan="4" style="padding: 40px; text-align: center;">
                            <div class="loading-spinner"></div>
                            <p style="color: var(--text-muted); font-family: var(--font-display); font-size: 0.8rem; margin-top: 8px;">Loading 2nd Anniversary Winners...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>HAIL HYDRA</p>
    </footer>

    <script src="3d-effects.js"></script>
    <script type="module" src="winners.js"></script>

</body>
</html>
